server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 25

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS13aGljaC1zaG91bGQtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  admin:
    default-username: ${ADMIN_USERNAME:admin}
    default-password: ${ADMIN_PASSWORD:admin123}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

email:
  api-key: ${EMAIL_API_KEY:${BREVO_API_KEY:${RESEND_API_KEY:}}}
  from-email: ${EMAIL_FROM:${BREVO_FROM_EMAIL:${RESEND_FROM_EMAIL:gondaliyaronak78@gmail.com}}}
  from-name: ${EMAIL_FROM_NAME:${BREVO_FROM_NAME:${RESEND_FROM_NAME:EventPass}}}
  smtp-host: ${SMTP_HOST:smtp-relay.brevo.com}
  smtp-port: ${SMTP_PORT:587}
  smtp-username: ${SMTP_USERNAME:${BREVO_SMTP_LOGIN:}}
  smtp-password: ${SMTP_PASSWORD:${BREVO_API_KEY:${RESEND_API_KEY:}}}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:gondaliyaronak78@gmail.com}
  from-name: ${RESEND_FROM_NAME:EventPass}
